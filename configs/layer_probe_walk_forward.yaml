# Full-history Layer 0~12 walk-forward mainline.
# The original configs/layer_probe.yaml and notebook remain historical artifacts.

experiment:
  name: continuous_label_layer_probe_walk_forward
  run_id: ${LAYER_PROBE_RUN_ID:-full_history_wf_v1}

text:
  path: ${LAYER_PROBE_TEXT_PATH:-artifacts/report_labels/reports.parquet}
  id_column: ${LAYER_PROBE_TEXT_ID_COLUMN:-report_id}
  text_column: ${LAYER_PROBE_TEXT_COLUMN:-text}
  symbol_column: ${LAYER_PROBE_SYMBOL_COLUMN:-stock_code}
  date_column: ${LAYER_PROBE_DATE_COLUMN:-available_date}
  limit: null

model:
  checkpoint: ${CKPT_PATH:-chinese-wwm-roberta.ckpt}
  base_model_dir: ${BASE_MODEL_DIR:-chinese-roberta-wwm-ext}
  # With both GPUs visible, physical GPU 1 is cuda:1.  When launching with
  # CUDA_VISIBLE_DEVICES=1, override LAYER_PROBE_DEVICE=cuda:0.
  device: ${LAYER_PROBE_DEVICE:-cuda:1}
  compute_dtype: float16
  storage_dtype: float16
  batch_size: 128
  batch_size_candidates: [64, 128, 256, 512]
  max_length: 512
  head_recipe: cls_fc
  head_provenance: user_locked_assumption
  layer12_rtol: null
  layer12_atol: null

continuous_targets:
  bundle_directory: ${LAYER_PROBE_TARGET_BUNDLE:-artifacts/probe_dataset_walk_forward_v1}

walk_forward:
  enabled: true
  history_start: "2014-01-01"
  validation:
    feature_start: "2018-01-01"
    feature_end: "2022-12-31"
    # No validation outcome revealed on/after the closed 2023 test may select alpha.
    selection_label_cutoff: "2022-12-31"
    fold_frequency: year
    minimum_folds: 2
  final_test:
    feature_start: "2023-01-01"
    feature_end: "2023-12-31"
    label_cutoff: "2026-06-18"
  minimum_train_rows: 100
  minimum_evaluation_rows: 100

fixed_head_analysis:
  enabled: true
  saturation_thresholds: [0.90, 0.95, 0.99]

fixed_head_label_analysis:
  enabled: true
  quantiles: 5

continuous_probe:
  enabled: true
  alpha_grid: [0.1, 1.0, 10.0, 100.0, 1000.0]
  selection_metric: mean_annual_validation_spearman
  solver: cholesky
  tolerance: 1.0e-6
  maximum_iterations: 10000

# Direct return probes are independent from continuous-label maturity.
return_time_splits:
  train:
    start: "2014-01-01"
    end: "2018-12-31"
  validation:
    start: "2019-01-01"
    end: "2022-12-31"
  test:
    start: "2023-01-01"
    end: "2023-12-31"

returns:
  industry_adjusted_daily_path: ${LAYER_PROBE_SPECIFIC_RETURN_DAILY:-/home/intern_fjq_2026/data/target/target_close_spret.h5}
  hdf_key: null
  horizons: [1, 5, 20]
  primary_horizon: 5
  purge_horizon: 20
  storage_dtype: float16
  aggregation_chunk_size: 16384

exposures:
  industry_path: ${LAYER_PROBE_INDUSTRY_PATH:-/home/intern_fjq_2026/data/barra/Barra_Industry.h5}
  industry_hdf_key: null
  size_path: ${LAYER_PROBE_SIZE_PATH:-/home/intern_fjq_2026/data/barra/Barra_SIZE.h5}
  size_hdf_key: null

return_probe:
  target_column: target_return_rank_5d
  alpha_grid: [0.1, 1.0, 10.0, 100.0, 1000.0]
  min_daily_observations: 20

label_factor_returns:
  horizons: [1, 5, 20]
  primary_horizon: 5
  min_daily_observations: 20
  quantiles: 5

layer_factor_correlations:
  method: daily_cross_sectional_spearman
  min_daily_observations: 20

cross_layer_factors:
  middle_layers: [4, 5, 6, 7, 8]
  deep_layers: [9, 10, 11, 12]
  pca_components: 3

strict_test:
  quantiles: 5
  selected_factors: []
  open_final_test: false

sentiment_appendix:
  enabled: false
  labels_path: ${LAYER_PROBE_SENTIMENT_LABEL_PATH:-}
  label_id_column: ${LAYER_PROBE_SENTIMENT_ID_COLUMN:-report_id}
  label_column: ${LAYER_PROBE_SENTIMENT_COLUMN:-sentiment_label}
  c_grid: [0.01, 0.1, 1.0, 10.0]
  positive_class_index: 1
  label_mapping_confirmed: false
  open_final_test: false

performance:
  shared_server: true
  max_threads: ${SHARED_SERVER_MAX_THREADS:-8}
  blas_threads: 1
  minimum_free_disk_gb: 15
  minimum_free_disk_fraction: 0.20

output:
  representation_store: ${LAYER_PROBE_REPRESENTATION_STORE:-artifacts/continuous_label_layer_probe/representation_store_full_history_wf_v1}
  run_directory: ${LAYER_PROBE_RUN_DIRECTORY:-artifacts/continuous_label_layer_probe/runs/full_history_wf_v1}
