# Full-history continuous-label bundle for expanding walk-forward probes.
# Static split assignment is deliberately disabled: fold membership is resolved
# from feature_available_date and label_available_date at model-fit time.

paths:
  report_labels: artifacts/report_labels

targets:
  forecast_horizons: [0, 1, 2]
  confirmation_months: [1, 3]
  peer_panels: [fixed, market, active]
  residual:
    enabled: true
  dispersion:
    enabled: true
    require_probe_valid: false

splits:
  enabled: false

performance:
  shared_server: true
  max_threads: 8
  nice_increment: 5
  blas_threads: 1

output:
  directory: artifacts/probe_dataset_walk_forward_v1
