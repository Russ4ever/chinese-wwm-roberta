# Actual 源字段适配模板。冒号左侧为固定 canonical 字段，右侧改为服务器源字段名。
columns:
  stock_code: stock_code
  fy: fy
  actual_np: actual_np
  actual_publish_date: actual_publish_date
  actual_known_date: actual_known_date
  unit_multiplier: unit_multiplier
  currency: currency
  source_id: source_id
  actual_version: actual_version
  actual_metric: actual_metric

# canonical Actual 必须已换算为人民币元；缺省声明只用于兼容字段齐全的旧文件。
defaults:
  unit_multiplier: 1.0
  currency: CNY
  actual_version: annual_consolidated_first_actual_announcement
  actual_metric: net_profit_incl_min_int_inc

# 只保留首次正式年报版本；源数据编码不同时修改右侧值。
filters:
  actual_version: [annual_consolidated_first_actual_announcement]
  actual_metric: [net_profit_incl_min_int_inc]
