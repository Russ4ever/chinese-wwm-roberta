# Probe dataset configuration
paths:
  report_labels: artifacts/report_labels

targets:
  forecast_horizons: [0, 1, 2]
  confirmation_months: [1, 3]
  peer_panels: [fixed, market, active]
  residual:
    enabled: true
  dispersion:
    enabled: true
    require_probe_valid: false

splits:
  enabled: true
  train:
    feature_start: "2024-01-01"
    feature_end: "2024-06-30"
    label_cutoff: "2024-06-29"
  validation:
    feature_start: "2024-07-01"
    feature_end: "2024-09-30"
    label_cutoff: "2024-09-29"
  test:
    feature_start: "2024-10-01"
    feature_end: "2024-12-31"
    label_cutoff: "2024-12-31"

performance:
  shared_server: true
  max_threads: 8
  nice_increment: 5
  blas_threads: 1

output:
  directory: artifacts/probe_dataset
